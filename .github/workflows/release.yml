name: Release CLI

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build CLI binaries
        run: cd apps/cli && bun run build

      - name: Create Latest Release
        run: |
          VERSION="$(head -n1 apps/cli/bin/version.txt)"
          TAG="v${VERSION%-*}"
          if gh release view $TAG --repo ${{ github.repository }} &>/dev/null; then
            gh release delete $TAG --yes --repo ${{ github.repository }}
          fi
          gh release create $TAG --repo ${{ github.repository }} \
            --target ${{ github.sha }} \
            --title "sloth $VERSION" \
            apps/cli/bin/*.gz apps/cli/bin/version.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
